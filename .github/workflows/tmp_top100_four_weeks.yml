name: tmp top100 four independent weeks
on:
  push:
    branches: [main]
    paths:
      - '.github/tmp_spot_production_baseline.py'
      - '.github/tmp_prod_reset_combo_replay.py'
      - '.github/workflows/tmp_top100_four_weeks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    name: week-${{ matrix.offset }}d
    strategy:
      fail-fast: false
      matrix:
        offset: [0, 7, 14, 21]
    runs-on: ubuntu-24.04
    env:
      WEEK_OFFSET_DAYS: ${{ matrix.offset }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests flask
      - name: Replay independent 7-day week
        shell: bash
        run: |
          set +e
          python .github/tmp_prod_reset_combo_replay.py 2>&1 | tee /tmp/week_run.log
          code=${PIPESTATUS[0]}
          echo "$code" > /tmp/week_exit_code.txt
          exit 0
      - name: Upload weekly result
        uses: actions/upload-artifact@v4
        with:
          name: top100-week-offset-${{ matrix.offset }}
          retention-days: 14
          path: |
            /tmp/reset_combo_summary.csv
            /tmp/reset_combo_trades.csv
            /tmp/reset_combo_ledger.csv
            /tmp/reset_combo_signals.csv
            /tmp/week_run.log
            /tmp/week_exit_code.txt
          if-no-files-found: warn
