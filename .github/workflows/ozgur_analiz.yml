name: Özgür Analiz

on:
  workflow_dispatch:
    inputs:
      note:
        description: 'Tetikleyici not (opsiyonel)'
        required: false
        default: ''
  schedule:
    - cron: '0 7 * * *'  # Her gün 10:00 Istanbul (UTC+3)

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bağımlılıkları yükle
        run: pip install requests anthropic

      - name: Analiz çalıştır
        env:
          PORTFOLIO_URL: ${{ secrets.PORTFOLIO_URL }}
          PORTFOLIO_AUTH_TOKEN: ${{ secrets.PORTFOLIO_AUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANALYZER_TELEGRAM_TOKEN: ${{ secrets.ANALYZER_TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TRIGGER_NOTE: ${{ inputs.note }}
        run: python portfolio_analysis_action.py
