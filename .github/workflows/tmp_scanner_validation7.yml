name: tmp scanner validation7
on:
  push:
    branches: [main]
jobs:
  validate:
    if: contains(github.event.head_commit.message, 'run winner loser separation validation')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy scikit-learn
      - run: python .github/tmp_scanner_validation7.py
      - run: |
          cp /tmp/v7_summary.csv .github/tmp_validation7_summary.csv
          cp /tmp/v7_trades.csv .github/tmp_validation7_trades.csv
          cp /tmp/v7_features.csv .github/tmp_validation7_features.csv
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .github/tmp_validation7_*.csv
          git commit -m 'test: save winner loser separation results' || exit 0
          git pull --rebase
          git push
