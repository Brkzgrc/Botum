name: tmp scanner validation10
on:
  push:
    branches: [main]
jobs:
  validate:
    if: contains(github.event.head_commit.message, 'run 15m retrigger timing validation')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy scikit-learn
      - run: python .github/tmp_scanner_validation10.py
      - run: |
          cp /tmp/v10_summary.csv .github/tmp_validation10_summary.csv
          cp /tmp/v10_trades.csv .github/tmp_validation10_trades.csv
          cp /tmp/v10_features.csv .github/tmp_validation10_features.csv
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -f .github/tmp_validation10_*.csv
          git status --short
          git commit -m 'test: save 15m retrigger timing results'
          git pull --rebase
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: validation10-results
          path: .github/tmp_validation10_*.csv
