name: tmp scanner validation5
on:
  push:
    branches: [main]
jobs:
  validate:
    if: contains(github.event.head_commit.message, 'run return-focused scanner validation')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy scikit-learn
      - run: python .github/tmp_scanner_validation5.py
      - run: |
          cp /tmp/v5_summary.csv .github/tmp_validation5_summary.csv
          cp /tmp/v5_capital.csv .github/tmp_validation5_capital.csv
          cp /tmp/v5_trades.csv .github/tmp_validation5_trades.csv
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .github/tmp_validation5_summary.csv .github/tmp_validation5_capital.csv .github/tmp_validation5_trades.csv
          git commit -m 'test: save return-focused validation results' || exit 0
          git pull --rebase
          git push
