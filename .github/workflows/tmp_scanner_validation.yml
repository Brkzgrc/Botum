name: tmp scanner validation
on:
  push:
    paths:
      - '.github/tmp_scanner_validation.py'
      - '.github/workflows/tmp_scanner_validation.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy
      - run: python .github/tmp_scanner_validation.py
      - run: |
          cp /tmp/validation_rows.csv .github/tmp_validation_rows.csv
          cp /tmp/validation_summary.csv .github/tmp_validation_summary.csv
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/tmp_validation_rows.csv .github/tmp_validation_summary.csv
          git commit -m 'test: save temporary scanner validation results' || exit 0
          git push
