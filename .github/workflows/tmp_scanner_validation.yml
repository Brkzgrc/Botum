name: tmp scanner validation
on:
  push:
    paths:
      - '.github/tmp_scanner_validation.py'
      - '.github/workflows/tmp_scanner_validation.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy
      - run: python .github/tmp_scanner_validation.py
      - uses: actions/upload-artifact@v4
        with:
          name: scanner-validation
          path: |
            /tmp/validation_rows.csv
            /tmp/validation_summary.csv
