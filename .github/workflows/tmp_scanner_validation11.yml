name: tmp scanner validation11
on:
  push:
    branches: [main]
jobs:
  validate:
    if: contains(github.event.head_commit.message, 'run 15m flat and robustness validation')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy scikit-learn
      - run: python .github/tmp_scanner_validation11.py
      - run: |
          cp /tmp/v11_summary.csv .github/tmp_validation11_summary.csv
          cp /tmp/v11_cal_grid.csv .github/tmp_validation11_cal_grid.csv
          cp /tmp/v11_test_robust.csv .github/tmp_validation11_test_robust.csv
          cp /tmp/v11_trades.csv .github/tmp_validation11_trades.csv
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -f .github/tmp_validation11_*.csv
          git commit -m 'test: save 15m flat and robustness results'
          git pull --rebase
          git push
