name: tmp scanner validation12
on:
  push:
    branches: [main]
    paths:
      - '.github/tmp_scanner_validation12.py'
      - '.github/workflows/tmp_scanner_validation12.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy scikit-learn
      - run: python .github/tmp_scanner_validation12.py
      - name: Save results
        run: |
          cp /tmp/v12_summary.csv .github/tmp_validation12_summary.csv
          cp /tmp/v12_cal_grid.csv .github/tmp_validation12_cal_grid.csv
          cp /tmp/v12_test_robust.csv .github/tmp_validation12_test_robust.csv
          cp /tmp/v12_trades.csv .github/tmp_validation12_trades.csv
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -f .github/tmp_validation12_*.csv
          git commit -m 'test: save V12 capital efficiency results'
          git pull --rebase
          git push
