name: Spot Scanner Signal Audit

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Başlangıç (UTC, ör. 2026-09-04T00:00:00Z)"
        required: false
        default: "2026-09-04T00:00:00Z"
      end:
        description: "Bitiş (UTC)"
        required: false
        default: "2026-09-08T23:59:00Z"
      symbols:
        description: "İncelenecek en likit güncel USDT spot parite sayısı"
        required: false
        default: "120"

# Workflow dosyası eklendiğinde yalnız bir kez otomatik çalışır.
# Sonraki çalıştırmalar Actions ekranından Run workflow ile yapılır.
  push:
    paths:
      - ".github/workflows/spot-signal-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    name: Chronological signal audit
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      AUDIT_START: ${{ inputs.start || '2026-09-04T00:00:00Z' }}
      AUDIT_END: ${{ inputs.end || '2026-09-08T23:59:00Z' }}
      AUDIT_SYMBOLS: ${{ inputs.symbols || '120' }}
      TELEGRAM_ENABLED: "false"
      PORTFOLIO_URL: ""
      SCAN_ON_START: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install audit dependencies
        run: pip install --disable-pip-version-check --quiet numpy pandas requests flask

      - name: Restore Binance candle cache
        uses: actions/cache@v4
        with:
          path: .audit_cache
          key: spot-signal-audit-v1-${{ env.AUDIT_START }}-${{ env.AUDIT_END }}-${{ env.AUDIT_SYMBOLS }}

      - name: Replay current scanner without live output
        shell: bash
        run: |
          mkdir -p audit_output .audit_cache
          cat > /tmp/run_spot_audit.py <<'PY'
          import csv, json, os, time, traceback
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          import numpy as np
          import pandas as pd
          import requests

          import spot_opportunity_scanner as scanner

          START = pd.to_datetime(os.environ["AUDIT_START"], utc=True)
          END = pd.to_datetime(os.environ["AUDIT_END"], utc=True)
          TOP_N = max(20, min(120, int(os.environ["AUDIT_SYMBOLS"])))
          CACHE = Path(".audit_cache")
          OUT = Path("audit_output")
          OUT.mkdir(exist_ok=True)
          HTTP = requests.Session()
          HTTP.headers.update({"User-Agent": "Botum-chronological-audit/1.0"})
          COLS = ["open_time","open","high","low","close","volume","close_time","quote_volume","trades","taker_base","taker_quote","ignore"]
          data = {}
          current_cutoff = START
          live_price = {}

          def get_json(url, params=None):
              for attempt in range(5):
                  try:
                      r = HTTP.get(url, params=params, timeout=25)
                      if r.status_code in (418,429):
                          time.sleep(1.5 * (attempt + 1)); continue
                      r.raise_for_status()
                      return r.json()
                  except Exception:
                      if attempt == 4: raise
                      time.sleep(1.2 * (attempt + 1))

          def frame(rows):
              d = pd.DataFrame(rows, columns=COLS)
              for col in ("open","high","low","close","volume","quote_volume","taker_quote"):
                  d[col] = pd.to_numeric(d[col], errors="coerce")
              d["open_time"] = pd.to_datetime(d["open_time"], unit="ms", utc=True)
              d["close_time"] = pd.to_datetime(d["close_time"], unit="ms", utc=True)
              return d.dropna(subset=["open","high","low","close","volume"]).reset_index(drop=True)

          def load(symbol, interval, limit):
              name = CACHE / f"{symbol}_{interval}_{int(END.timestamp())}_{limit}.json"
              if name.exists():
                  rows = json.loads(name.read_text())
              else:
                  rows = get_json("https://api.binance.com/api/v3/klines", {
                      "symbol": symbol, "interval": interval, "limit": limit,
                      "endTime": int(END.timestamp() * 1000)
                  })
                  name.write_text(json.dumps(rows))
              d = frame(rows)
              if len(d) < 80:
                  raise RuntimeError(f"{symbol} {interval}: yetersiz mum")
              return d

          def eligible_universe():
              exchange = get_json("https://api.binance.com/api/v3/exchangeInfo")
              ticks = {x["symbol"]: x for x in get_json("https://api.binance.com/api/v3/ticker/24hr")}
              ignored = scanner.IGNORED_BASES
              out = []
              for x in exchange.get("symbols", []):
                  sym, base = x.get("symbol",""), x.get("baseAsset","")
                  if x.get("quoteAsset") != "USDT" or x.get("status") != "TRADING":
                      continue
                  if base in ignored or (base.endswith(scanner.LEVERAGED_SUFFIXES) and base not in scanner.CRYPTO_BASES_ENDING_B):
                      continue
                  try: qv = float(ticks.get(sym, {}).get("quoteVolume", 0))
                  except Exception: qv = 0
                  out.append((sym, qv))
              return sorted(out, key=lambda x: x[1], reverse=True)[:TOP_N]

          universe = eligible_universe()
          symbols = ["BTCUSDT"] + [s for s,_ in universe]
          quote_volume = dict(universe)
          print(f"[AUDIT] {len(universe)} coin | {START} -> {END}", flush=True)

          def fetch_symbol(symbol):
              return symbol, {
                  "15m": load(symbol, "15m", 1000),
                  "1h": load(symbol, "1h", 260),
                  "4h": load(symbol, "4h", 260),
                  "1d": load(symbol, "1d", 260),
              }

          with ThreadPoolExecutor(max_workers=10) as pool:
              futures = [pool.submit(fetch_symbol, s) for s in symbols]
              for n, future in enumerate(as_completed(futures), 1):
                  sym, series = future.result()
                  data[sym] = series
                  if n % 15 == 0 or n == len(symbols):
                      print(f"[DATA] {n}/{len(symbols)}", flush=True)

          active = [s for s,_ in universe if s in data]
          if "BTCUSDT" not in data or not active:
              raise SystemExit("Yeterli Binance verisi indirilemedi.")

          def historical_ohlcv(symbol, interval, limit=240):
              d = data[symbol][interval]
              closed = d[d["close_time"] <= current_cutoff]
              if len(closed) < 80:
                  raise ValueError(f"{symbol} {interval}: {current_cutoff} öncesi yetersiz kapanmış mum")
              return closed.tail(limit).copy().reset_index(drop=True)

          old_ohlcv, old_get = scanner.ohlcv, scanner._get
          scanner.ohlcv = historical_ohlcv

          def historical_get(path, params=None, attempts=4):
              if path == "/api/v3/ticker/price":
                  return {"price": str(live_price.get((params or {}).get("symbol"), 0))}
              return old_get(path, params, attempts)
          scanner._get = historical_get

          def prepare_cutoff(cutoff):
              global current_cutoff, live_price
              current_cutoff = cutoff
              live_price = {}
              for sym in active + ["BTCUSDT"]:
                  d = historical_ohlcv(sym, "15m", 240)
                  live_price[sym] = float(d.close.iloc[-1])

          def choose_prefilter():
              rows = []
              for sym in active:
                  try:
                      got = scanner._prefilter(sym, quote_volume.get(sym, 0))
                      if got: rows.append(got)
                  except Exception:
                      pass
              rows.sort(key=lambda x: x[2], reverse=True)
              selected = list(rows[:scanner.PREFILTER_CORE_N])
              seen = {x[0] for x in selected}
              for row in rows[scanner.PREFILTER_CORE_N:]:
                  if len(selected) >= scanner.PYTHON_TOP_N: break
                  if row[3] and row[0] not in seen:
                      selected.append(row); seen.add(row[0])
              for row in rows[scanner.PREFILTER_CORE_N:]:
                  if len(selected) >= scanner.PYTHON_TOP_N: break
                  if row[0] not in seen:
                      selected.append(row); seen.add(row[0])
              return [(s,q,r) for s,q,r,_ in selected]

          def rnum(x):
              try: return round(float(x), 4)
              except Exception: return None

          def feature_row(symbol, cutoff):
              prepare_cutoff(cutoff)
              one = scanner.snap(historical_ohlcv(symbol, "1h", 260), "1H")
              four = scanner.snap(historical_ohlcv(symbol, "4h", 260), "4H")
              day = scanner.snap(historical_ohlcv(symbol, "1d", 260), "1D")
              fast = scanner.snap(historical_ohlcv(symbol, "15m", 260), "15M")
              one_df = historical_ohlcv(symbol, "1h", 260)
              base_72 = float(one_df.close.iloc[-73]) if len(one_df) >= 73 else np.nan
              ext72 = scanner.pct(float(one_df.close.iloc[-1]), base_72) if np.isfinite(base_72) else None
              return {
                  "price": rnum(fast["price"]), "ret_72h": rnum(ext72),
                  "1h_rsi": rnum(one["rsi"]), "1h_stoch": rnum(one["stoch_k"]),
                  "1h_ret3": rnum(one["ret3"]), "1h_ret24": rnum(one["ret24"]),
                  "1h_dist_ema20": rnum(one["dist_ema20"]), "1h_dist_ema50": rnum(one["dist_ema50"]),
                  "4h_rsi": rnum(four["rsi"]), "4h_ret24": rnum(four["ret24"]),
                  "4h_dist_ema50": rnum(four["dist_ema50"]),
                  "1d_rsi": rnum(day["rsi"]), "15m_rsi": rnum(fast["rsi"]),
                  "15m_stoch": rnum(fast["stoch_k"]),
                  "15m_macd_hist": rnum(fast["macd_hist"]),
              }

          watch, emitted, replay_rows = {}, [], []
          daily_count = {}
          cutoffs = pd.date_range(START.ceil("15min"), END.floor("15min"), freq="15min", tz="UTC")
          for idx, cutoff in enumerate(cutoffs, 1):
              try:
                  prepare_cutoff(cutoff)
                  pre = choose_prefilter()
                  regime = scanner.btc_regime()
                  finals, waits = [], []
                  for sym, qv, pre_rank in pre:
                      try:
                          c = scanner.evaluate(sym, qv, pre_rank, regime, watch.get(sym))
                          if c.decision["decision"] == "ALIM_ADAYI": finals.append(c)
                          elif c.decision["decision"] == "TETIK_BEKLE": waits.append(c)
                      except Exception:
                          continue
                  for c in waits:
                      rec = watch.get(c.symbol) or {"first_seen": cutoff.timestamp(), "first_price": c.snapshot["live_price"], "observations": 0, "last_bar_15m": 0}
                      oldbar = int(float(rec.get("last_bar_15m", 0) or 0))
                      bar = int(c.snapshot["15m"]["bar_id"])
                      if oldbar and bar > oldbar: rec["observations"] = int(rec.get("observations",0)) + 1
                      rec.update({"phase":c.decision["state"], "setup_kind":c.decision["setup_kind"], "last_bar_15m":bar, "updated_at":cutoff.timestamp()})
                      watch[c.symbol] = rec
                  day_key = cutoff.strftime("%Y-%m-%d")
                  room = max(0, scanner.MAX_SIGNALS_PER_DAY - daily_count.get(day_key, 0))
                  for c in sorted(finals, key=lambda x: x.rank, reverse=True)[:room]:
                      lv = scanner.levels(c)
                      daily_count[day_key] = daily_count.get(day_key, 0) + 1
                      watch.pop(c.symbol, None)
                      row = {
                          "time_utc": cutoff.isoformat(), "symbol": c.symbol, "setup": c.decision["setup_kind"],
                          "score": rnum(c.decision["confidence"]), "btc_regime": regime,
                          "entry": rnum(lv["price"]), "stop": rnum(lv["stop"]), "tp1": rnum(lv["tp1"]),
                          "target_pct": rnum(scanner.pct(lv["tp1"], lv["price"])),
                          "stop_pct": rnum(scanner.pct(lv["price"], lv["stop"])),
                      }
                      row["rr"] = rnum((row["target_pct"] or 0) / row["stop_pct"]) if row["stop_pct"] else None
                      row.update(feature_row(c.symbol, cutoff))
                      replay_rows.append(row)
              except Exception as exc:
                  print(f"[CUT] {cutoff}: {type(exc).__name__}: {exc}", flush=True)
              if idx % max(1, len(cutoffs)//12) == 0:
                  print(f"[REPLAY] {idx}/{len(cutoffs)} | emitted={len(replay_rows)}", flush=True)

          # Actual Portfolio rows: exact signal record plus the data that was available then.
          snapshot = json.loads(Path("portfolio_snapshot.json").read_text())
          actual = list(snapshot.get("open", [])) + list(snapshot.get("closed", []))
          actual_rows = []
          for s in actual:
              if s.get("source") != "spot-scanner":
                  continue
              symbol = s.get("symbol","").replace("/","")
              if symbol not in data: continue
              opened = pd.Timestamp(s["open_time"]).tz_convert("UTC")
              cutoff = opened.floor("15min")
              if cutoff < START or cutoff > END: continue
              try:
                  row = {
                      "time_utc": opened.isoformat(), "symbol": symbol, "status": s.get("status"),
                      "close_reason": s.get("close_reason"), "entry": s.get("entry"),
                      "stop": s.get("stop"), "tp1": s.get("tp1"), "close_pct": s.get("close_pct"),
                      "peak_pct": s.get("peak_pct"), "setup": s.get("extra",{}).get("setup_kind"),
                      "score": s.get("extra",{}).get("score"), "btc_regime": s.get("extra",{}).get("btc_regime"),
                      "target_pct": s.get("extra",{}).get("target_pct"), "stop_pct": s.get("extra",{}).get("stop_pct"),
                      "rr": s.get("extra",{}).get("rr"),
                  }
                  row.update(feature_row(symbol, cutoff))
                  actual_rows.append(row)
              except Exception as exc:
                  actual_rows.append({"time_utc": opened.isoformat(), "symbol": symbol, "audit_error": str(exc)})

          def write_csv(path, rows):
              keys = sorted({k for r in rows for k in r}) if rows else ["note"]
              with open(path, "w", newline="", encoding="utf-8") as f:
                  w = csv.DictWriter(f, fieldnames=keys); w.writeheader(); w.writerows(rows)

          write_csv(OUT / "actual_portfolio_signal_audit.csv", actual_rows)
          write_csv(OUT / "replayed_scanner_emissions.csv", replay_rows)

          # Post-hoc momentum windows are explicitly labelled outcome research, not valid entry signals.
          signal_times = {}
          for r in replay_rows:
              signal_times.setdefault(r["symbol"], []).append(pd.Timestamp(r["time_utc"]))
          misses = []
          hourly = pd.date_range(START.ceil("1h"), (END - pd.Timedelta(hours=24)).floor("1h"), freq="1h", tz="UTC")
          for symbol in active:
              d = data[symbol]["15m"]
              for cutoff in hourly:
                  prior = d[d.close_time <= cutoff]
                  future = d[(d.close_time > cutoff) & (d.close_time <= cutoff + pd.Timedelta(hours=24))]
                  if prior.empty or future.empty: continue
                  entry = float(prior.close.iloc[-1]); mfe = (float(future.high.max()) / entry - 1) * 100
                  if mfe < 12: continue
                  had = any(abs((t-cutoff).total_seconds()) <= 4*3600 for t in signal_times.get(symbol, []))
                  if not had:
                      misses.append({"time_utc":cutoff.isoformat(),"symbol":symbol,"future_24h_mfe_pct":round(mfe,2),"note":"Sonradan ölçülen hareket; canlı sinyal kanıtı değildir."})
          misses = sorted(misses, key=lambda x:x["future_24h_mfe_pct"], reverse=True)[:150]
          write_csv(OUT / "posthoc_unemitted_momentum_windows.csv", misses)

          rr_bad = [r for r in actual_rows if isinstance(r.get("rr"), (int,float)) and r["rr"] < 1]
          summary = {
              "period_utc": {"start":START.isoformat(),"end":END.isoformat()},
              "universe_current_top_n": len(active),
              "portfolio_records_audited": len(actual_rows),
              "replay_emissions": len(replay_rows),
              "actual_low_rr_below_1": len(rr_bad),
              "actual_low_rr_symbols": [r.get("symbol") for r in rr_bad],
              "posthoc_unemitted_momentum_windows": len(misses),
              "method_limits": [
                  "Replay yalnız kapanmış mumları kullanır.",
                  "Geçmişteki gerçek Binance parite evreni yeniden kurulamaz; güncel en likit 120 USDT paritesi kullanılır.",
                  "Post-hoc momentum dosyası gelecekte oluşan hareketi işaretler; bunu geçmişte geçerli sinyal saymaz.",
                  "Bu Action Render'a, Portfolio API'sine veya Telegram'a hiçbir çağrı yapmaz."
              ]
          }
          (OUT / "summary.json").write_text(json.dumps(summary, ensure_ascii=False, indent=2))
          print(json.dumps(summary, ensure_ascii=False, indent=2), flush=True)
          PY
          PYTHONPATH="$PWD" python /tmp/run_spot_audit.py | tee audit_output/run.log

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spot-signal-audit
          path: audit_output/
          if-no-files-found: warn
          retention-days: 30
