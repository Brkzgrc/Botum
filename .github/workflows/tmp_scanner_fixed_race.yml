name: tmp scanner fixed candidate race
on:
  push:
    branches: [main]
    paths:
      - '.github/tmp_scanner_fixed_race.py'
      - '.github/workflows/tmp_scanner_fixed_race.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy scikit-learn
      - name: Freeze the shared 90-day window
        shell: bash
        run: |
          sed -i "s/NOW=pd.Timestamp.now(tz='UTC').floor('1h'); START=NOW-pd.Timedelta(days=90)/NOW=pd.Timestamp('2026-09-05T00:00:00Z'); START=NOW-pd.Timedelta(days=90)/" .github/tmp_scanner_validation3.py
          grep -F "NOW=pd.Timestamp('2026-09-05T00:00:00Z')" .github/tmp_scanner_validation3.py
      - name: Run fixed candidate race
        shell: bash
        run: |
          set +e
          python .github/tmp_scanner_fixed_race.py 2>&1 | tee /tmp/fixed_race_run.log
          code=${PIPESTATUS[0]}
          echo "$code" > /tmp/fixed_race_exit_code.txt
          exit 0
      - name: Save race outputs or failure log
        shell: bash
        run: |
          git checkout -- .github/tmp_scanner_validation3.py
          cp /tmp/fixed_race_run.log .github/tmp_fixed_race_run.log
          cp /tmp/fixed_race_exit_code.txt .github/tmp_fixed_race_exit_code.txt
          for f in summary ranking params trades v14_cal v16_cal v17_cal v18_cal; do
            if [ -f "/tmp/fixed_race_${f}.csv" ]; then cp "/tmp/fixed_race_${f}.csv" ".github/tmp_fixed_race_${f}.csv"; fi
          done
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -f .github/tmp_fixed_race_*
          git commit -m 'test: save fixed candidate race results' || true
          git pull --rebase
          git push
