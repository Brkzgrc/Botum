name: tmp scanner validation18
on:
  push:
    branches: [main]
    paths:
      - '.github/tmp_scanner_validation18.py'
      - '.github/workflows/tmp_scanner_validation18.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy scikit-learn
      - name: Run V18 and capture diagnostics
        shell: bash
        run: |
          set +e
          python .github/tmp_scanner_validation18.py 2>&1 | tee /tmp/v18_run.log
          code=${PIPESTATUS[0]}
          echo "$code" > /tmp/v18_exit_code.txt
          exit 0
      - name: Save V18 outputs or failure log
        shell: bash
        run: |
          cp /tmp/v18_run.log .github/tmp_validation18_run.log
          cp /tmp/v18_exit_code.txt .github/tmp_validation18_exit_code.txt
          for f in summary benchmark cal_grid test_robust trades; do
            if [ -f "/tmp/v18_${f}.csv" ]; then cp "/tmp/v18_${f}.csv" ".github/tmp_validation18_${f}.csv"; fi
          done
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -f .github/tmp_validation18_*
          git commit -m 'test: save V18 run diagnostics' || true
          git pull --rebase
          git push
