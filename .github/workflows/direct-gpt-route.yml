name: Direct GPT route patch

on:
  push:
    paths:
      - '.github/workflows/direct-gpt-route.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch portfolio Telegram poller directly
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('portfolio_tracker.py')
          s = p.read_text(encoding='utf-8')

          old = '''from intraday_scanner import start_intraday_scanner
          from liquidity_radar import get_radar, radar_ui_lines
          '''
          new = '''from intraday_scanner import start_intraday_scanner
          from liquidity_radar import get_radar, radar_ui_lines
          from anton_scanner.gpt_sonnet_analyzer.anton_integration import (
              parse_gpt_symbol as _parse_gpt_analyzer_symbol,
              _run_gpt_analysis as _run_gpt_analyzer,
          )
          '''
          assert s.count(old) == 1, f'import anchor count={s.count(old)}'
          s = s.replace(old, new, 1)

          old = '''    print(
                  f"[MANUEL ANALYZER CONFIG] mod={_manual_analyzer_mode} | sağlayıcı={provider} | "
                  f"API anahtarı={'hazır' if key_ready else 'eksik'}",
                  flush=True,
              )
          '''
          new = '''    print(
                  f"[MANUEL ANALYZER CONFIG] mod={_manual_analyzer_mode} | sağlayıcı={provider} | "
                  f"API anahtarı={'hazır' if key_ready else 'eksik'} | GPT route=GPT Sonnet Analyzer",
                  flush=True,
              )
          '''
          assert s.count(old) == 1, f'config anchor count={s.count(old)}'
          s = s.replace(old, new, 1)

          old = '''    print(f"[MANUEL ANALYZER] Thread {ANALYZER_THREAD_ID} dinleniyor; otomatik analiz kapalı.", flush=True)
          '''
          new = '''    print(
                  f"[MANUEL ANALYZER] Thread {ANALYZER_THREAD_ID} dinleniyor | normal=mevcut Anton | `COIN GPT`=GPT Sonnet Analyzer.",
                  flush=True,
              )
          '''
          assert s.count(old) == 1, f'listen anchor count={s.count(old)}'
          s = s.replace(old, new, 1)

          old = '''                pair = _parse_manual_analyzer_symbol(msg.get("text", ""))
                          if not pair:
                              continue
                          threading.Thread(
                              target=_run_manual_analyzer, args=(pair,), daemon=True,
                              name=f"manual-analyzer-{pair}",
                          ).start()
          '''
          new = '''                text = msg.get("text", "")
                          gpt_pair = _parse_gpt_analyzer_symbol(text)
                          if gpt_pair:
                              threading.Thread(
                                  target=_run_gpt_analyzer,
                                  args=(gpt_pair, ANALYZER_TELEGRAM_TOKEN, chat_id, thread_id),
                                  daemon=True,
                                  name=f"gpt-sonnet-{gpt_pair}",
                              ).start()
                              continue

                          pair = _parse_manual_analyzer_symbol(text)
                          if not pair:
                              continue
                          threading.Thread(
                              target=_run_manual_analyzer, args=(pair,), daemon=True,
                              name=f"manual-analyzer-{pair}",
                          ).start()
          '''
          assert s.count(old) == 1, f'route anchor count={s.count(old)}'
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY

          python -m py_compile portfolio_tracker.py anton_scanner/gpt_sonnet_analyzer/anton_integration.py
          test ! -e sitecustomize.py

      - name: Commit only the direct route and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/direct-gpt-route.yml
          git add portfolio_tracker.py
          git commit -m "Route COIN GPT in existing portfolio poller"
          git pull --rebase origin main
          git push origin HEAD:main
