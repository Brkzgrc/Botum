name: tmp scanner validation6
on:
  push:
    branches: [main]
jobs:
  validate:
    if: contains(github.event.head_commit.message, 'run chronological return validation')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy scikit-learn
      - run: python .github/tmp_scanner_validation6.py
      - run: |
          cp /tmp/v6_summary.csv .github/tmp_validation6_summary.csv
          cp /tmp/v6_cal_grid.csv .github/tmp_validation6_cal_grid.csv
          cp /tmp/v6_test_robust.csv .github/tmp_validation6_test_robust.csv
          cp /tmp/v6_trades.csv .github/tmp_validation6_trades.csv
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .github/tmp_validation6_*.csv
          git commit -m 'test: save chronological return validation results' || exit 0
          git pull --rebase
          git push
