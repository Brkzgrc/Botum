name: tmp production baseline capital score
on:
  push:
    branches: [main]
    paths:
      - '.github/tmp_prod_baseline_capital.py'
      - '.github/workflows/tmp_prod_baseline_capital.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  score:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas
      - name: Score $2,500 one-position portfolio
        shell: bash
        run: |
          set +e
          python .github/tmp_prod_baseline_capital.py 2>&1 | tee /tmp/prod_capital_run.log
          code=${PIPESTATUS[0]}
          echo "$code" > /tmp/prod_capital_exit_code.txt
          exit 0
      - name: Save capital score outputs
        shell: bash
        run: |
          cp /tmp/prod_capital_run.log .github/tmp_prod_capital_run.log
          cp /tmp/prod_capital_exit_code.txt .github/tmp_prod_capital_exit_code.txt
          for f in summary ledger daily; do
            if [ -f "/tmp/prod_capital_${f}.csv" ]; then cp "/tmp/prod_capital_${f}.csv" ".github/tmp_prod_capital_${f}.csv"; fi
          done
          if [ -f /tmp/prod_capital_rules.json ]; then cp /tmp/prod_capital_rules.json .github/tmp_prod_capital_rules.json; fi
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -f .github/tmp_prod_capital_*
          git commit -m 'test: save production baseline capital score' || true
          git pull --rebase
          git push
