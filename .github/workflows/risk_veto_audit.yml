name: risk veto audit two poor weeks
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/risk_veto_audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    name: poor-week-${{ matrix.offset }}d
    strategy:
      fail-fast: false
      matrix:
        offset: [7, 21]
    runs-on: ubuntu-24.04
    env:
      WEEK_OFFSET_DAYS: ${{ matrix.offset }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests flask
      - name: Replay frozen live-system entries
        run: python .github/tmp_prod_reset_combo_replay.py
      - name: Upload risk-audit inputs
        uses: actions/upload-artifact@v4
        with:
          name: risk-veto-input-offset-${{ matrix.offset }}
          retention-days: 14
          path: |
            /tmp/reset_combo_summary.csv
            /tmp/reset_combo_trades.csv
            /tmp/reset_combo_ledger.csv
            /tmp/reset_combo_signals.csv
